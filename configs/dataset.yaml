# ============================================================
# TrajRACE Canonical Dataset Configuration
# Dataset: Porto
#
# This file contains ONLY dataset, public-road-network,
# preprocessing, and train/valid/test split settings.
# Privacy, risk, SBS, recovery, and evaluation parameters
# are defined in configs/exp_main.yaml.
# ============================================================

dataset_name: porto
dataset_version: canonical_rebuttal_v1

# ============================================================
# 1. Data paths
# ============================================================

variants_base_dir: data/variants

raw_csv: data/raw/porto/train.csv

# Canonical main-experiment sample size.
# The scalability experiment may override this value.
porto_raw_sample_size: 100000


# ============================================================
# 2. Timestamp construction
# ============================================================

# Porto records are sampled at approximately 15-second intervals.
sampling_interval_sec: 15

segment_time_mode: fixed_interval_from_trip_start


# ============================================================
# 3. Public road network and public caches
# ============================================================

# The road network is public information under the threat model.
road_graph_path: data/intermediate/road_network/porto.graphml

# Public road-network shortest-path distance cache.
distance_cache_path: data/intermediate/road_network/porto_distance_cache.json

# Public legal-successor cache N(u).
successor_cache_path: data/intermediate/road_network/porto_successor_cache.json

# Use the fixed public graph for reproducibility.
# Do not silently download a different road-network snapshot.
download_osm_if_missing: false

osm_place_name: "Porto, Portugal"

# IMPORTANT:
# This must be a single deterministic method in the final artifact.
# If the final preprocessing implementation uses HMM instead,
# replace this value with "hmm" before freezing the artifact.
map_matching_method: simple_nearest


# ============================================================
# 4. Dataset split
# ============================================================

train_ratio: 0.8
valid_ratio: 0.1
test_ratio: 0.1

split_seed: 42


# ============================================================
# 5. Raw-trajectory preprocessing
# ============================================================

drop_missing_data: true

min_points_per_traj: 10

# Do not truncate long raw trajectories before map matching.
# Long trajectories are preserved and subsequently partitioned
# into multiple SBSs according to L_m in exp_main.yaml.
max_points_per_traj_before_map_matching: null

truncate_raw_trajectory: false

# Merge consecutive mapped points located on the same road segment,
# consistent with the road-segment trajectory definition.
deduplicate_consecutive_segments: true

# Preserve the complete mapped road-segment sequence.
# SBS partitioning is performed later by build_events.py.
truncate_mapped_trajectory: false
preserve_full_mapped_trajectory: true

# Keep trajectories only if the final road-segment sequence
# contains enough segments to form at least one transition.
min_mapped_segments: 2

# Failed map matching is treated explicitly instead of silently
# generating incomplete trajectories.
map_matching_failure_policy: drop_trajectory
